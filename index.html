<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sealed Scroll</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Georgia, serif;
  background: radial-gradient(circle at top, #2b1a0d 0%, #120904 60%, #090402 100%);
  color: #f6e7c7;
  -webkit-user-select: none;
  user-select: none;
}

body {
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 460px;
  padding: 42px 20px 40px;
  text-align: center;
}

h1 {
  font-size: 19px;
  margin-bottom: 10px;
}

.sub {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 24px;
}

.phrase-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
}

.slot {
  width: 50px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  border: 1px solid rgba(236,199,118,0.35);
  background: rgba(255,220,150,0.08);
  font-size: 24px;
  cursor: pointer;
}

.space {
  width: 16px;
}

.selected {
  box-shadow: 0 0 14px rgba(255,215,140,0.4);
}

.solved {
  opacity: 0.7;
}

.letters {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.letter {
  height: 52px;
  border-radius: 14px;
  border: 1px solid rgba(236,199,118,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.decoded {
  font-size: 20px;
  letter-spacing: 2px;
  min-height: 30px;
  margin: 10px 0;
}
